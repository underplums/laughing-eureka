[tool.poetry]
name = "cvm_churn_from_dac_binary_class_churn_dac"
version = "0.1.0"
description = ""
authors = ["gorelova_i_v <gorelova_i_v@magnit.ru>"]
readme = "README.md"
packages = [
  { from = "src", include = "cvm_model" },
  { from = "src", include = "cvm_model_entrypoint" },
]

[tool.poetry.dependencies]
python = ">=3.9, <3.12"
magpie = { path = "libs/magpie" }
python-decouple = "^3.8"
mlflow = "~3.1.4"
psycopg = { version = "3.1.10", extras = ["binary"] }
typer = "^0.20.0"
pydantic = "^2.12.4"
backoff = "^2.2.1"
pyyaml = "^6.0.3"
devtools = "^0.12.2"
# Ваши либы, с жёстко запиниными версиями
pandas = "1.5.3"
numpy = "1.26.4"
scikit-learn = "1.6.1"
tqdm = "4.67.0"
catboost = "1.2.10"
cvm-ml-metrics = {path = "libs/cvm_ml_metrics"}
shap = "0.49.1"
optuna = "4.8.0"
traitlets = "5.15.0"
ipython = "8.0"
ipywidgets = "8.1.8"

[tool.poetry.group.dev.dependencies]
python-decouple-stubs = "^3.8.0.4"
pyspark = "3.0.3"
pyspark-stubs = "3.0.0.post3"
pandas-stubs = "1.5.3.230321"
basedpyright = "^1.33.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUntypedFunctionDecorator = false
exclude = ["*.ipynb", "libs/"]
